global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: ["/etc/prometheus/u02-alerts.yml", "/etc/prometheus/u03-alerts.yml", "/etc/prometheus/u04-alerts.yml", "/etc/prometheus/u05-alerts.yml", "/etc/prometheus/u06-alerts.yml"]
scrape_configs:
  - job_name: ott-api
    metrics_path: /api/v1/metrics
    static_configs: [{targets: ["api:8000"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: ott-u06-worker
    metrics_path: /metrics
    static_configs: [{targets: ["u06-worker:8081"]}]
  - job_name: ott-u06-deep-health
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://api:8000/api/v1/health/deep", "http://u06-worker:8081/health/deep"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox-exporter:9115"}
