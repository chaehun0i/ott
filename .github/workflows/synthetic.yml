name: scheduled-synthetic
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.13"}
      - run: python scripts/synthetic.py "${{ secrets.PROTOTYPE_BASE_URL }}"

