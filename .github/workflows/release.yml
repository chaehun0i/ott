name: release
on:
  # Tag-triggered releases are paused while the workflow suite is stabilized.
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
          provenance: true
          sbom: true
      - run: echo "${{ github.sha }} ${{ github.ref_name }} ${{ steps.build.outputs.digest }}" > release-evidence.txt
      - uses: actions/upload-artifact@v4
        with: {name: release-evidence-${{ github.ref_name }}, path: release-evidence.txt}
