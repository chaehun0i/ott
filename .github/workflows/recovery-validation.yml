name: recovery-validation
on:
  # Scheduled triggers are paused while the workflow suite is stabilized.
  workflow_dispatch:
permissions: {contents: read}
jobs:
  backup:
    if: github.event.schedule == '15 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y age postgresql-client rclone
      - run: sh scripts/backup.sh | tee backup-evidence.txt
        env:
          DATABASE_URL: "${{ secrets.PROTOTYPE_DATABASE_URL }}"
          BACKUP_REMOTE: "${{ secrets.BACKUP_REMOTE }}"
          BACKUP_AGE_RECIPIENT: "${{ secrets.BACKUP_AGE_RECIPIENT }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backup-evidence-${{ github.run_id }}, path: backup-evidence.txt}
  restore-drill:
    if: github.event.schedule == '30 3 1 */3 *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "Quarterly restore requires an isolated target and approved archive inputs." > restore-drill-evidence.txt
      - run: test -n "${{ secrets.RESTORE_DRILL_DATABASE_URL }}" && test -n "${{ secrets.RESTORE_ARCHIVE }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: restore-drill-evidence-${{ github.run_id }}, path: restore-drill-evidence.txt}
