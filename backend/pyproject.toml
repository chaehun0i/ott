[project]
name = "ott-feed-platform"
version = "0.1.0"
description = "Platform runtime for the OTT latest-content feed and recommendation service"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "Authlib==1.7.2",
  "cryptography==49.0.0",
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.161.5",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "contract: API and consumer contract tests",
  "integration: PostgreSQL and adapter integration tests",
  "pbt: property-based tests",
]

[tool.coverage.run]
branch = true
source = [
  "src/ott_feed/platform",
  "src/ott_feed/identity",
  "src/ott_feed/catalog",
  "src/ott_feed/search",
  "src/ott_feed/ingestion",
  "src/ott_feed/recommendation",
  "src/ott_feed/engagement",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ott_feed"]
mypy_path = "src"
